<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { void: "#0b0b12", surface: "#15151f", surface2: "#1e1e2b", borderSubtle: "#2a2a38", textPrimary: "#f4f4f7", textSecondary: "#9a97a3", textMuted: "#8b8b9b", accent: "#ff4d6d", accent2: "#3ddc97" },
          fontFamily: { display: ["Space Grotesk", "sans-serif"], sans: ["Inter", "sans-serif"] },
          keyframes: {
            'eq-bounce': { '0%, 100%': { transform: 'scaleY(0.4)' }, '50%': { transform: 'scaleY(1)' } },
            'skeleton-sweep': { '100%': { transform: 'translateX(100%)' } },
            'spin': { 'to': { transform: 'rotate(360deg)' } }
          },
          animation: {
            'eq-bounce': 'eq-bounce 1.1s ease-in-out infinite',
            'skeleton-sweep': 'skeleton-sweep 1.4s ease-in-out infinite',
            'spin-fast': 'spin 0.7s linear infinite'
          }
        },
      },
    };
  </script>
  <style>
    body {
      background-image: radial-gradient(ellipse 900px 500px at 15% -10%, #ff4d6d14, transparent 60%), radial-gradient(ellipse 700px 500px at 100% 0%, #3ddc9712, transparent 55%);
      background-attachment: fixed;
    }

    .scroll-row::-webkit-scrollbar {
      height: 8px;
    }

    .scroll-row::-webkit-scrollbar-thumb {
      background: #1e1e2b;
      border-radius: 999px;
    }

    .scroll-row::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>

<body class="bg-void text-textPrimary font-sans antialiased min-h-screen">

  <div id="app-topbar"
    class="sticky top-0 z-40 h-[68px] flex items-center justify-between gap-[20px] px-[28px] bg-[#0b0b12ee] backdrop-blur-[10px] border-b border-borderSubtle max-sm:px-[14px] max-sm:gap-[10px]">
  </div>

  <div class="max-w-[1280px] mx-auto pt-[30px] px-[28px] pb-[70px] max-sm:pt-[22px] max-sm:px-[14px] max-sm:pb-[60px]">
    <header class="mb-8">
      <p id="greeting" class="text-white/50 text-sm mb-1">Chào mừng trở lại</p>
      <h1 class="font-display text-3xl font-bold tracking-[-0.01em]">Khám phá âm nhạc hôm nay</h1>
    </header>

    <div id="search-results-note" class="text-sm text-white/50 mb-4 hidden"></div>

    <section class="mb-[36px]">
      <div class="flex items-baseline justify-between mb-[14px]">
        <h2 class="text-[1.35rem] font-bold font-display tracking-[-0.01em]">Nghệ sĩ nổi bật</h2>
        <span class="text-[0.78rem] text-textMuted mr-auto ml-[10px]" id="count-artists"></span>
        <button
          class="text-[0.8rem] font-bold text-textSecondary uppercase tracking-[0.03em] bg-transparent border-none cursor-pointer hover:text-textPrimary transition-colors"
          data-toggle-for="row-artists">Xem tất cả</button>
      </div>
      <div id="row-artists" class="flex gap-[16px] overflow-x-auto pb-[6px] scroll-smooth scroll-row"></div>
    </section>

    <section class="mb-[36px]">
      <div class="flex items-baseline justify-between mb-[14px]">
        <h2 class="text-[1.35rem] font-bold font-display tracking-[-0.01em]">Album mới</h2>
        <span class="text-[0.78rem] text-textMuted mr-auto ml-[10px]" id="count-albums"></span>
        <button
          class="text-[0.8rem] font-bold text-textSecondary uppercase tracking-[0.03em] bg-transparent border-none cursor-pointer hover:text-textPrimary transition-colors"
          data-toggle-for="row-albums">Xem tất cả</button>
      </div>
      <div id="row-albums" class="flex gap-[16px] overflow-x-auto pb-[6px] scroll-smooth scroll-row"></div>
    </section>

    <section class="mb-[36px]">
      <div class="flex items-baseline justify-between mb-[14px]">
        <h2 class="text-[1.35rem] font-bold font-display tracking-[-0.01em]">Bài hát thịnh hành</h2>
        <span class="text-[0.78rem] text-textMuted mr-auto ml-[10px]" id="count-tracks"></span>
        <button
          class="text-[0.8rem] font-bold text-textSecondary uppercase tracking-[0.03em] bg-transparent border-none cursor-pointer hover:text-textPrimary transition-colors"
          data-toggle-for="row-tracks">Xem tất cả</button>
      </div>
      <div id="row-tracks" class="flex gap-[16px] overflow-x-auto pb-[6px] scroll-smooth scroll-row"></div>
    </section>

    <section class="mb-[36px]">
      <div class="flex items-baseline justify-between mb-[14px]">
        <h2 class="text-[1.35rem] font-bold font-display tracking-[-0.01em]">Playlist dành cho bạn</h2>
        <span class="text-[0.78rem] text-textMuted mr-auto ml-[10px]" id="count-playlists"></span>
        <button
          class="text-[0.8rem] font-bold text-textSecondary uppercase tracking-[0.03em] bg-transparent border-none cursor-pointer hover:text-textPrimary transition-colors"
          data-toggle-for="row-playlists">Xem tất cả</button>
      </div>
      <div id="row-playlists" class="flex gap-[16px] overflow-x-auto pb-[6px] scroll-smooth scroll-row"></div>
    </section>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/home.js"></script>
</body>

</html>
