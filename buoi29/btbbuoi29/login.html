<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spotify</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { void: "#0b0b12", surface: "#15151f", surface2: "#1e1e2b", borderSubtle: "#2a2a38", textPrimary: "#f4f4f7", textSecondary: "#9a97a3", textMuted: "#8b8b9b", accent: "#ff4d6d", accent2: "#3ddc97" },
        fontFamily: { display: ["Space Grotesk", "sans-serif"], sans: ["Inter", "sans-serif"] },
        keyframes: {
          'eq-bounce': { '0%, 100%': { transform: 'scaleY(0.4)' }, '50%': { transform: 'scaleY(1)' } },
          'skeleton-sweep': { '100%': { transform: 'translateX(100%)' } },
          'spin': { 'to': { transform: 'rotate(360deg)' } }
        },
        animation: {
          'eq-bounce': 'eq-bounce 1.1s ease-in-out infinite',
          'skeleton-sweep': 'skeleton-sweep 1.4s ease-in-out infinite',
          'spin-fast': 'spin 0.7s linear infinite'
        }
      },
    },
  };
</script>
<style>
  body {
    background-image: radial-gradient(ellipse 900px 500px at 15% -10%, #ff4d6d14, transparent 60%), radial-gradient(ellipse 700px 500px at 100% 0%, #3ddc9712, transparent 55%);
    background-attachment: fixed;
  }
  .scroll-row::-webkit-scrollbar { height: 8px; }
  .scroll-row::-webkit-scrollbar-thumb { background: #1e1e2b; border-radius: 999px; }
  .scroll-row::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body class="bg-void text-textPrimary font-sans antialiased min-h-screen">

<div class="min-h-screen flex flex-col items-center justify-center py-[40px] px-[20px]">
  <div class="w-full max-w-[420px] bg-surface border border-borderSubtle rounded-[18px] py-[40px] px-[36px] max-sm:py-[30px] max-sm:px-[22px] shadow-[0_30px_70px_#00000055]">
    <div class="flex justify-center mb-[18px]">
      <svg viewBox="0 0 24 24" fill="#1ed760" class="w-[44px] h-[44px]" aria-hidden="true">
        <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.72 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
      </svg>
    </div>
    <h1 class="text-center text-[1.7rem] font-bold mb-[22px] font-display tracking-[-0.01em]">Chào mừng trở lại</h1>

    <div id="form-alert" class="hidden flex gap-[10px] items-start bg-[#ff4d6d14] border border-[#ff4d6d3d] text-[#ffb3c1] py-[11px] px-[13px] rounded-[10px] text-[0.83rem] mb-[18px]">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mt-[2px] shrink-0">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 8v5M12 16h.01" stroke-linecap="round" />
      </svg>
      <span id="form-alert-text"></span>
    </div>

    <form id="login-form" novalidate>
      <div class="mb-[16px]">
        <label for="email" class="block text-[0.8rem] font-bold text-textSecondary mb-[6px]">Email</label>
        <input id="email" name="email" type="email" placeholder="name@domain.com" autocomplete="email" class="w-full bg-void border border-borderSubtle rounded-[10px] py-[12px] px-[14px] text-[0.92rem] text-textPrimary transition-colors focus:outline-none focus:border-accent" />
        <p class="text-[0.75rem] text-[#ff8a8a] mt-[5px] min-h-[1em]" data-error-for="email"></p>
      </div>
      <div class="mb-[16px]">
        <label for="password" class="block text-[0.8rem] font-bold text-textSecondary mb-[6px]">Mật khẩu</label>
        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" class="w-full bg-void border border-borderSubtle rounded-[10px] py-[12px] px-[14px] text-[0.92rem] text-textPrimary transition-colors focus:outline-none focus:border-accent" />
        <p class="text-[0.75rem] text-[#ff8a8a] mt-[5px] min-h-[1em]" data-error-for="password"></p>
      </div>

      <button id="submit-btn" type="submit" class="inline-flex items-center justify-center gap-[8px] bg-accent text-[#17070c] font-bold text-[0.88rem] py-[11px] px-[22px] rounded-full transition-all hover:brightness-[1.08] active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed w-full mt-[8px]">
        <span id="submit-label">Đăng nhập</span>
      </button>
    </form>

    <p class="text-center mt-[20px] text-[0.85rem] text-textMuted">Chưa có tài khoản? <a href="register.html" class="text-accent font-bold hover:underline">Đăng ký ngay</a></p>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/validators.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
