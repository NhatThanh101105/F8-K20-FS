<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cá nhân — Nhịp</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { void: "#0b0b12", surface: "#15151f", surface2: "#1e1e2b", borderSubtle: "#2a2a38", textPrimary: "#f4f4f7", textSecondary: "#9a97a3", textMuted: "#8b8b9b", accent: "#ff4d6d", accent2: "#3ddc97" },
        fontFamily: { display: ["Space Grotesk", "sans-serif"], sans: ["Inter", "sans-serif"] },
        keyframes: {
          'eq-bounce': { '0%, 100%': { transform: 'scaleY(0.4)' }, '50%': { transform: 'scaleY(1)' } },
          'skeleton-sweep': { '100%': { transform: 'translateX(100%)' } },
          'spin': { 'to': { transform: 'rotate(360deg)' } }
        },
        animation: {
          'eq-bounce': 'eq-bounce 1.1s ease-in-out infinite',
          'skeleton-sweep': 'skeleton-sweep 1.4s ease-in-out infinite',
          'spin-fast': 'spin 0.7s linear infinite'
        }
      },
    },
  };
</script>
<style>
  body {
    background-image: radial-gradient(ellipse 900px 500px at 15% -10%, #ff4d6d14, transparent 60%), radial-gradient(ellipse 700px 500px at 100% 0%, #3ddc9712, transparent 55%);
    background-attachment: fixed;
  }
  .scroll-row::-webkit-scrollbar { height: 8px; }
  .scroll-row::-webkit-scrollbar-thumb { background: #1e1e2b; border-radius: 999px; }
  .scroll-row::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body class="bg-void text-textPrimary font-sans antialiased min-h-screen">

<div id="app-topbar" class="sticky top-0 z-40 h-[68px] flex items-center justify-between gap-[20px] px-[28px] bg-[#0b0b12ee] backdrop-blur-[10px] border-b border-borderSubtle max-sm:px-[14px] max-sm:gap-[10px]"></div>

<div class="max-w-[760px] mx-auto pt-[30px] px-[28px] pb-[70px] max-sm:pt-[22px] max-sm:px-[14px] max-sm:pb-[60px]">
  <header class="mb-8">
    <h1 class="font-display text-3xl font-bold tracking-[-0.01em]">Trang cá nhân</h1>
  </header>

  <div id="profile-loading" class="flex items-center gap-5">
    <div class="w-[84px] h-[84px] rounded-full shrink-0 overflow-hidden relative bg-surface2 after:absolute after:inset-0 after:-translate-x-full after:bg-[linear-gradient(90deg,transparent,#ffffff10,transparent)] after:animate-skeleton-sweep" style="background:transparent;"></div>
    <div class="space-y-2">
      <div class="h-[18px] w-[180px] rounded-[6px] relative overflow-hidden bg-surface2 after:absolute after:inset-0 after:-translate-x-full after:bg-[linear-gradient(90deg,transparent,#ffffff10,transparent)] after:animate-skeleton-sweep"></div>
      <div class="h-[12px] w-[140px] rounded-[6px] relative overflow-hidden bg-surface2 after:absolute after:inset-0 after:-translate-x-full after:bg-[linear-gradient(90deg,transparent,#ffffff10,transparent)] after:animate-skeleton-sweep"></div>
    </div>
  </div>

  <div id="profile-error" class="hidden border border-dashed border-borderSubtle rounded-[14px] py-[34px] px-[20px] text-center text-textMuted"></div>

  <div id="profile-content" class="hidden">
    <div class="flex items-center gap-5 mb-8">
      <div id="profile-avatar-wrap" class="w-[84px] h-[84px] rounded-full bg-gradient-to-br from-accent to-[#ff8a4d] flex items-center justify-center text-[1.6rem] font-bold text-[#14141c] shrink-0 overflow-hidden"></div>
      <div>
        <h2 id="profile-name" class="font-display text-2xl font-bold tracking-[-0.01em]"></h2>
        <p id="profile-username" class="text-white/50 text-sm"></p>
      </div>
    </div>

    <dl id="profile-fields" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></dl>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/profile.js"></script>
</body>
</html>
