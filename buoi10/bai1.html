<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 1</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #f0f0f0;
}
.box-container {
    width: 300px;
    height: 300px;
    border: 3px solid red; 
    position: relative;
}
.arrow {
    position: absolute;
    width: 50px;
    height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    font-weight: bold;
    color: black;
    transform: translate(0, 0);
    animation: moveSquare 4s linear infinite;
}

.arrow::after {
    content: "→";
}

@keyframes moveSquare {
    0% {
        top: 0; left: 0;
        transform: translate(-50%, -50%) rotate(0deg);
    }
    24.99% { transform: translate(-50%, -50%) rotate(0deg); }
    25% {
        top: 0; left: 100%;
        transform: translate(-50%, -50%) rotate(90deg);
    }

    49.99% { transform: translate(-50%, -50%) rotate(90deg); }
    50% {
        top: 100%; left: 100%;
        transform: translate(-50%, -50%) rotate(180deg);
    }

    74.99% { transform: translate(-50%, -50%) rotate(180deg); }
    75% {
        top: 100%; left: 0;
        transform: translate(-50%, -50%) rotate(270deg);
    }

    99.99% { transform: translate(-50%, -50%) rotate(270deg); }
    100% {
        top: 0; left: 0;
        transform: translate(-50%, -50%) rotate(0deg);
    }
}
    </style>
</head>
<body>
    <div class="box-container">
        <div class="arrow"></div>
    </div>
</body>
</html>
