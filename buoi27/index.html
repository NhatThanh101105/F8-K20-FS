<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập BOM & SPA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-6">

    <div id="home-view" class="max-w-4xl mx-auto block">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">Trang Chủ (BOM Info)</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="bg-white p-4 rounded shadow">
                <span class="font-semibold text-gray-500">Trạng thái:</span>
                <div class="mt-1 flex items-center font-medium">
                    <span id="online-icon" class="w-3 h-3 rounded-full bg-gray-300 inline-block mr-2"></span>
                    <span id="online-status">Đang kiểm tra...</span>
                </div>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <span class="font-semibold text-gray-500">Vị trí (Tọa độ):</span>
                <p id="geo-info" class="mt-1 font-medium">Đang lấy vị trí...</p>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <span class="font-semibold text-gray-500">Trình duyệt:</span>
                <p id="browser-info" class="mt-1 font-medium"></p>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <span class="font-semibold text-gray-500">Hệ điều hành:</span>
                <p id="os-info" class="mt-1 font-medium"></p>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <span class="font-semibold text-gray-500">Ngôn ngữ:</span>
                <p id="lang-info" class="mt-1 font-medium"></p>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <span class="font-semibold text-gray-500">Kích thước màn hình:</span>
                <p id="screen-info" class="mt-1 font-medium"></p>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <span class="font-semibold text-gray-500">Hướng màn hình:</span>
                <p id="orientation-info" class="mt-1 font-medium"></p>
            </div>
        </div>

        <div class="mb-8">
            <h2 class="text-xl font-bold mb-4">Banner Quảng Cáo</h2>
            <a href="campaign.html?utm_source=tram_thanh_nhan&utm_campaign=campage_1" 
               class="block rounded-lg overflow-hidden shadow-lg hover:shadow-2xl hover:-translate-y-1 transition transform duration-300">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" 
                     alt="Banner" class="w-full h-64 object-cover">
            </a>
        </div>

        <div class="text-center">
            <button id="btn-fingerprint" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded shadow transition duration-300">
                Tạo Fingerprint (SPA)
            </button>
        </div>
    </div>

    <div id="fingerprint-view" class="max-w-4xl mx-auto hidden">
        <h1 class="text-3xl font-bold text-center mb-8 text-purple-600">Trang Fingerprinting</h1>
        
        <div class="bg-white p-6 rounded-lg shadow-lg mb-8">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2">Chuỗi Fingerprint Của Bạn:</h2>
            <p id="fingerprint-data" class="font-mono text-sm break-words bg-gray-100 p-4 rounded text-gray-700"></p>
        </div>

        <div class="text-center">
            <button id="btn-back" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded shadow transition duration-300">
                Quay Về Trang Chủ
            </button>
        </div>
    </div>
    <script src="main.js" ></script>
</body>
</html>
