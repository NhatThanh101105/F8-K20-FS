<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buổi 28</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-[#f5f5f5] text-gray-800 font-sans">

    <header class="bg-[#ee4d2d] sticky top-0 z-30 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                <a href="index.html" class="text-2xl font-bold text-white flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                    Shopee
                </a>
                
                <div class="w-full md:w-1/2 relative flex bg-white rounded-sm shadow-sm overflow-hidden">
                    <input type="text" class="search-input w-full px-4 py-2.5 text-sm focus:outline-none" placeholder="Tìm kiếm sản phẩm, thương hiệu...">
                    <button class="bg-[#ee4d2d] text-white px-6 py-2 m-0.5 rounded-sm hover:bg-[#d74326] transition-colors flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="bg-white shadow-sm mb-6 sticky top-[76px] z-20">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap gap-4 items-center text-sm">
            <span class="text-gray-500 font-medium">Sắp xếp theo</span>
            <select class="sort-select border border-gray-300 rounded-sm px-3 py-1.5 focus:border-[#ee4d2d] outline-none cursor-pointer bg-white">
                <option value="">Phổ biến</option>
                <option value="price-asc">Giá: Thấp đến Cao</option>
                <option value="price-desc">Giá: Cao đến Thấp</option>
                <option value="title-asc">Tên: A-Z</option>
                <option value="title-desc">Tên: Z-A</option>
            </select>

            <span class="text-gray-500 font-medium ml-4">Danh mục</span>
            <select class="category-filter border border-gray-300 rounded-sm px-3 py-1.5 focus:border-[#ee4d2d] outline-none cursor-pointer bg-white">
                <option value="">Tất cả</option>
            </select>
        </div>
    </div>

    <main class="max-w-6xl mx-auto px-4 pb-8 min-h-[60vh]">
        <div class="loading-state hidden flex justify-center items-center py-20">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-[#ee4d2d]"></div>
        </div>

        <div class="error-state hidden text-center py-12 text-[#ee4d2d] bg-white rounded-sm shadow-sm"></div>

        <div class="product-grid grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-2.5">
            </div>
    </main>

    <div class="max-w-6xl mx-auto px-4 pb-12 flex justify-center items-center gap-6">
        <button class="btn-prev px-4 py-2 bg-white border shadow-sm rounded-sm hover:bg-gray-50 disabled:opacity-50 text-gray-600 transition">❮ Quay lại</button>
        <span class="page-info text-[#ee4d2d] font-medium text-lg">1 / 1</span>
        <button class="btn-next px-4 py-2 bg-white border shadow-sm rounded-sm hover:bg-gray-50 disabled:opacity-50 text-gray-600 transition">Tiếp theo ❯</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
