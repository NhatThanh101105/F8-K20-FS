<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Carousel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-4xl mb-4 flex justify-between">
        <h2 class="text-white text-2xl font-bold">Infinite Slider</h2>
        <a href="index.html" class="text-sm text-gray-400 hover:text-white transition">← Quay lại</a>
    </div>

    <div id="slider-container" tabindex="0" class="relative w-full max-w-4xl h-[500px] rounded-2xl overflow-hidden shadow-2xl focus:outline-none focus:ring-4 focus:ring-blue-500 group">
        
        <div class="absolute top-4 right-4 z-20 bg-black/60 text-white px-3 py-1 rounded-full text-sm font-semibold tracking-widest backdrop-blur-sm">
            <span id="slide-counter">1 / 5</span>
        </div>

        <div id="track" class="flex h-full w-full">
            </div>

        <button id="prev-btn" class="absolute left-4 top-1/2 -translate-y-1/2 z-10 w-12 h-12 flex items-center justify-center rounded-full bg-black/30 text-white hover:bg-black/70 transition opacity-0 group-hover:opacity-100">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <button id="next-btn" class="absolute right-4 top-1/2 -translate-y-1/2 z-10 w-12 h-12 flex items-center justify-center rounded-full bg-black/30 text-white hover:bg-black/70 transition opacity-0 group-hover:opacity-100">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>

        <div id="dots-container" class="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 flex gap-2">
            </div>
    </div>
    
    <script src="slider.js"></script>
</body>
</html>
